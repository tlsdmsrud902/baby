<section class="baby-page-hero baby-menu-hero" aria-label="컬렉션 안내" data-cms="목록 위 큰 배너" data-cms-adapter="menuHero" data-cms-page="목록 공통">
 <img src="/SkinImg/baby/scene-nursery.webp" alt="햇살 드는 아기 방" width="1600" height="900" fetchpriority="high">
 <div><small>THE EVERYDAY COLLECTION</small><h1>Good things.<br>For little ones.</h1><p>함께 먹고, 놀고, 자는 하루.<br>우리 아이의 일상에 어울리는 것을 찾아보세요.</p>
 <nav aria-label="컬렉션 메뉴"><a data-baby-menu="all" href="/product/list.html?cate_no=28">전체상품</a><a data-baby-menu="newborn" href="/product/list.html?cate_no=24">신생아</a><a data-baby-menu="toddler" href="/product/list.html?cate_no=25">걸음마 아기</a><a data-baby-menu="outing" href="/product/list.html?cate_no=26">외출/나들이</a><a data-baby-menu="review" href="/board/product/list.html?board_no=4">리뷰</a></nav></div>
</section>
<!-- 상품분류 목록에서만 보이는 검색창 (상품검색 페이지는 자체 검색창이 있다) -->
<form class="baby-list-search" action="/product/search.html" method="get" role="search" hidden>
 <label for="babyListKeyword" class="displaynone">상품 검색</label>
 <input id="babyListKeyword" name="keyword" type="search" placeholder="찾으시는 상품을 검색해 보세요" autocomplete="off">
 <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5" stroke-linecap="round"></path></svg></button>
</form>
<script>
(function(){
 var hero=document.querySelector('.baby-menu-hero');if(!hero)return;
 var params=new URLSearchParams(location.search),word=params.get('keyword')||'',path=location.pathname,board=path.indexOf('/board/')===0;
 var catm=path.match(/\/category\/[^\/]+\/(\d+)/),cate=String(params.get('cate_no')||(catm&&catm[1])||'');
 var list=/\/product\/list\.html$/.test(path)||!!catm;
 // 게시판 : 리뷰(4) · 공지사항(1) · 자주묻는질문(3) · 상품문의(6) 은 같은 배너를 쓴다
 var boardKey={'4':'review','1':'notice','3':'faq','6':'qna'}[params.get('board_no')];
 if(board&&!boardKey){hero.remove();return;}
 // SALE(27)은 전용 세일 화면이 따로 있다
 if(list&&cate==='27'){hero.remove();return;}
 // 상품분류 번호 : 24 신생아 · 25 걸음마 아기 · 26 외출/나들이 (관리자 대분류)
 var byCate={'28':'all','24':'newborn','25':'toddler','26':'outing'};
 var key=board?boardKey:list?(byCate[cate]||'all'):/외출|나들이|유모차|카시트/.test(word)?'outing':/유아|걸음마|토들러/.test(word)?'toddler':/신생아|배냇|속싸개/.test(word)?'newborn':'all';
 // 배너 내용 : 게시판 화면 관리의 '목록 위 큰 배너' 글로 바꿀 수 있다 (baby-cms.js 가 window.BABYANG_MENU_HERO 를 덮어쓴다)
 var banners=window.BABYANG_MENU_HERO=window.BABYANG_MENU_HERO||{
  all:['scene-nursery.webp','햇살 드는 아기 방','THE EVERYDAY COLLECTION','Good things.<br>For little ones.','함께 먹고, 놀고, 자는 하루.<br>우리 아이의 일상에 어울리는 것을 찾아보세요.'],
  newborn:['scene-sleep-white.webp','하얀 담요 위에서 자는 신생아','THE NEWBORN COLLECTION','Tiny hands.<br>Softest things.','처음 입는 옷부터 포근한 잠자리까지.<br>갓 태어난 아기를 위한 다정한 선택.'],
  toddler:['scene-blocks.webp','언니와 함께 원목 블록을 쌓는 아기','THE TODDLER COLLECTION','Little explorers.<br>Big curiosity.','잡고, 쌓고, 걸어 보는 하루.<br>호기심 많은 걸음마 아기를 위한 일상.'],
  outing:['scene-puddle.webp','노란 우비를 입고 물웅덩이를 들여다보는 아이','THE OUTING COLLECTION','Small steps.<br>Big adventures.','익숙한 동네도 함께라면 새로운 여행.<br>가볍고 편안한 나들이를 준비해보세요.'],
  review:['scene-reading.webp','소파에서 형과 함께 그림책을 보는 아기','LIFE, SHARED','Real moments.<br>Shared with love.','함께 써본 경험이 더 좋은 선택으로.<br>엄마 아빠의 일상과 사용 후기를 만나보세요.'],
  notice:['scene-reading.webp','소파에서 형과 함께 그림책을 보는 아기','NEWS & NOTICE','Little news.<br>From baby앙.','baby앙의 새로운 소식과<br>꼭 알아 두실 안내를 전해 드려요.'],
  faq:['scene-reading.webp','소파에서 형과 함께 그림책을 보는 아기','GOOD TO KNOW','Questions?<br>We have answers.','주문 · 배송 · 교환 · 반품에 대해<br>자주 묻는 질문을 모았어요.'],
  qna:['scene-reading.webp','소파에서 형과 함께 그림책을 보는 아기','ASK US','Ask anything.<br>We are here to help.','상품에 대해 궁금한 점을 남겨 주세요.<br>꼼꼼히 확인하고 답변드릴게요.']
 },img=hero.querySelector('img');
 var C=window.BABYANG_CMS;
 // 분류별 배경색은 게시판 글과 상관없으므로 바로 넣는다 (기다리는 동안 기본색 → 분류색으로 바뀌지 않게)
 hero.dataset.collection=key;
 function reveal(){hero.classList.add('is-ready')}
 function fill(){
  var data=banners[key]||banners.all,src=/^(https?:)?\/\/|^\//.test(data[0])?data[0]:'/SkinImg/baby/'+data[0];
  if(!C||!C.holding||!C.holding())hero.classList.add('is-filled');
  img.alt=data[1];hero.querySelector('small').textContent=data[2];hero.querySelector('h1').innerHTML=data[3];hero.querySelector('p').innerHTML=data[4];
  // 사진이 바뀌면 새 사진을 다 받은 뒤 보인다
  if(img.getAttribute('src')!==src){hero.classList.remove('is-ready');img.addEventListener('load',reveal,{once:true});img.addEventListener('error',reveal,{once:true});img.src=src;}
  if(img.complete&&img.naturalWidth)reveal();
 }
 // 기억한 게시판 글이 있으면 이 코드가 실행되는 순간 바로 그리고, 없으면 게시판을 다 읽은 뒤 그린다. 늦게 들어오거나 바뀌면 다시 그린다.
 var painted='';
 function paint(){var sig=JSON.stringify(banners[key]||banners.all);if(sig===painted)return;painted=sig;fill();}
 if(C){if(C.applyCachedSection&&C.applyCachedSection(hero))paint();C.ready(paint,1200);document.addEventListener('babyang:cms',paint);}else paint();
 var cur=hero.querySelector('[data-baby-menu="'+key+'"]');if(cur)cur.setAttribute('aria-current','page');
 var form=document.querySelector('.baby-list-search');if(form&&list)form.hidden=false;
}());
</script>
